<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeeTARA Real Model Comparison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #666;
            font-size: 1.2em;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
        }

        .status-dot.loading {
            background: #ffc107;
            animation: pulse 1s infinite;
        }

        .status-dot.error {
            background: #dc3545;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .prompt-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        .prompt-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .routing-analysis {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .routing-analysis.show {
            display: block;
        }

        .routing-title {
            font-weight: 600;
            color: #1976d2;
            margin-bottom: 8px;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .model-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .model-card.recommended {
            border-color: #28a745;
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.2);
        }

        .model-card.loading {
            border-color: #ffc107;
            box-shadow: 0 8px 25px rgba(255, 193, 7, 0.2);
        }

        .model-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .model-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .model-type {
            font-size: 0.9em;
            color: #666;
            margin-top: 2px;
        }

        .model-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            color: white;
        }

        .badge-full {
            background: #dc3545;
        }

        .badge-lite {
            background: #28a745;
        }

        .badge-specialist {
            background: #007bff;
        }

        .badge-recommended {
            background: #ffc107;
            color: #333;
        }

        .model-response {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            min-height: 120px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .model-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .metric-item {
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 2px;
        }

        .metric-value {
            font-weight: 600;
            color: #333;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #dc3545;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #28a745;
        }

        .model-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .model-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .model-checkbox:hover {
            background: #e9ecef;
        }

        .model-checkbox.selected {
            background: #e3f2fd;
            border-color: #2196f3;
        }

        .model-checkbox input {
            margin: 0;
        }

        .d-model-checkbox {
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .d-model-checkbox:hover {
            background: #e9ecef;
        }

        .d-model-checkbox.selected {
            background: #e3f2fd;
            border-color: #2196f3;
        }

        .d-category-header {
            font-weight: bold;
            margin: 10px 0 0 0;
        }

        @media (max-width: 768px) {
            .comparison-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 MeeTARA Real Model Comparison</h1>
            <div class="subtitle">Compare actual GGUF model responses in real-time</div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="systemStatus"></div>
                <span id="systemStatusText">Initializing...</span>
            </div>
            <div class="status-item">
                <span id="loadedModelsText">Loading models...</span>
            </div>
            <div class="status-item">
                <span id="llamaCppStatus">Checking llama.cpp...</span>
            </div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="promptInput">Enter your prompt:</label>
                <textarea 
                    id="promptInput" 
                    class="prompt-input" 
                    placeholder="Type your question or request here... (e.g., 'Explain quantum computing' or 'I have a headache, what should I do?')"
                ></textarea>
            </div>

            <div class="input-group">
                <label>Select models to compare:</label>
                <div class="input-group" id="dCategoryGroup" style="display:none; margin-bottom: 10px;">
                  <label for="dCategorySelect">Select D Category:</label>
                  <select id="dCategorySelect"></select>
                </div>
                <div class="model-selector" id="modelSelector">
                    <!-- Model checkboxes will be dynamically inserted here by JS -->
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="compareBtn" onclick="compareModels()">
                    🚀 Compare Models
                </button>
                <button class="btn btn-secondary" id="analyzeBtn" onclick="analyzeQuery()">
                    🧠 Analyze Query
                </button>
                <button class="btn btn-secondary" onclick="loadAllModels()">
                    📥 Load All Models
                </button>
                <button class="btn btn-secondary" onclick="clearResults()">
                    🗑️ Clear Results
                </button>
            </div>
        </div>

        <div class="routing-analysis" id="routingAnalysis">
            <div class="routing-title">🎯 Smart Routing Analysis</div>
            <div id="routingContent"></div>
        </div>

        <div class="comparison-grid" id="comparisonGrid">
            <!-- Model comparison cards will be inserted here -->
        </div>
    </div>

    <script>
        let systemStatus = {
            ready: false,
            loadedModels: [],
            llamaCppAvailable: false
        };

        // Populate model selector with available models
        async function populateModelSelector() {
            try {
                const response = await fetch('/api/models');
                const models = await response.json();

                const selector = document.getElementById('modelSelector');
                selector.innerHTML = '';

                // Separate A, B, C and D models
                const abcModels = [];
                const dModelsByCategory = {};

                Object.entries(models).forEach(([modelKey, model]) => {
                    if (!model.available) return;
                    if (modelKey.startsWith('D_')) {
                        const cat = model.category || 'Other';
                        if (!dModelsByCategory[cat]) dModelsByCategory[cat] = [];
                        dModelsByCategory[cat].push({ key: modelKey, ...model });
                    } else {
                        abcModels.push({ key: modelKey, ...model });
                    }
                });

                // Add A, B, C models first
                abcModels.forEach(model => {
                    const div = document.createElement('div');
                    div.className = 'model-checkbox selected';
                    div.dataset.model = model.key;
                    const input = document.createElement('input');
                    input.type = 'checkbox';
                    input.checked = true;
                    div.appendChild(input);
                    div.appendChild(document.createTextNode(` ${model.key} (${model.file_size})`));
                    selector.appendChild(div);
                    div.addEventListener('click', function() {
                        input.checked = !input.checked;
                        div.classList.toggle('selected', input.checked);
                    });
                });

                // --- D CATEGORY DROPDOWN LOGIC ---
                const dCategoryGroup = document.getElementById('dCategoryGroup');
                const dCategorySelect = document.getElementById('dCategorySelect');
                const dCategories = Object.keys(dModelsByCategory);

                function removeDModelCheckboxes() {
                    Array.from(selector.querySelectorAll('.d-model-checkbox, .d-category-header')).forEach(el => el.remove());
                }

                if (dCategories.length > 0) {
                    dCategoryGroup.style.display = '';
                    dCategorySelect.innerHTML = '';
                    dCategories.forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat;
                        option.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
                        dCategorySelect.appendChild(option);
                    });

                    // Show models for the selected category
                    function renderDModelsForCategory(selectedCat) {
                        removeDModelCheckboxes();
                        // Add header for D models
                        const header = document.createElement('div');
                        header.className = 'd-category-header';
                        header.style.fontWeight = 'bold';
                        header.style.margin = '10px 0 0 0';
                        header.textContent = `D_domain_specific: ${selectedCat}`;
                        selector.appendChild(header);
                        // Add D models for selected category
                        dModelsByCategory[selectedCat].forEach(model => {
                            const div = document.createElement('div');
                            div.className = 'model-checkbox selected d-model-checkbox';
                            div.dataset.model = model.key;
                            const input = document.createElement('input');
                            input.type = 'checkbox';
                            input.checked = true;
                            div.appendChild(input);
                            div.appendChild(document.createTextNode(` ${model.key} (${model.file_size})`));
                            selector.appendChild(div);
                            div.addEventListener('click', function() {
                                input.checked = !input.checked;
                                div.classList.toggle('selected', input.checked);
                            });
                        });
                    }

                    // Initial render
                    renderDModelsForCategory(dCategories[0]);

                    // Listen for dropdown changes
                    dCategorySelect.onchange = (e) => {
                        renderDModelsForCategory(e.target.value);
                    };
                } else {
                    dCategoryGroup.style.display = 'none';
                }
            } catch (error) {
                console.error('Failed to fetch models:', error);
            }
        }

        // Initialize the application
        async function init() {
            await populateModelSelector();
            updateStatus();
            await checkSystemStatus();
            setupEventListeners();
        }

        // Check system status
        async function checkSystemStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                
                systemStatus = {
                    ready: status.system_ready,
                    loadedModels: status.loaded_models,
                    llamaCppAvailable: status.llama_cpp_available
                };
                
                updateStatus();
                
                if (status.llama_cpp_available) {
                    showMessage('✅ Real model loading available!', 'success');
                } else {
                    showMessage('⚠️ Simulation mode - install llama-cpp-python for real models', 'warning');
                }
                
            } catch (error) {
                console.error('Failed to check system status:', error);
                showMessage('❌ Failed to connect to backend', 'error');
            }
        }

        // Update status display
        function updateStatus() {
            const statusDot = document.getElementById('systemStatus');
            const statusText = document.getElementById('systemStatusText');
            const loadedText = document.getElementById('loadedModelsText');
            const llamaText = document.getElementById('llamaCppStatus');

            if (systemStatus.ready) {
                statusDot.className = 'status-dot';
                statusText.textContent = 'System Ready';
            } else {
                statusDot.className = 'status-dot loading';
                statusText.textContent = 'Initializing...';
            }

            loadedText.textContent = `Loaded: ${systemStatus.loadedModels.length} models`;
            llamaText.textContent = systemStatus.llamaCppAvailable ? 'llama.cpp: Available' : 'llama.cpp: Simulation mode';
        }

        // Setup event listeners
        function setupEventListeners() {
            // Model selector checkboxes
            document.querySelectorAll('.model-checkbox').forEach(checkbox => {
                checkbox.addEventListener('click', function() {
                    const input = this.querySelector('input');
                    input.checked = !input.checked;
                    this.classList.toggle('selected', input.checked);
                });
            });

            // Enter key to compare
            document.getElementById('promptInput').addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    compareModels();
                }
            });
        }

        // Analyze query for smart routing
        async function analyzeQuery() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                showMessage('Please enter a prompt first', 'error');
                return;
            }

            try {
                const response = await fetch('/api/analyze_query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const analysis = await response.json();
                displayRoutingAnalysis(analysis);
                
            } catch (error) {
                console.error('Analysis failed:', error);
                showMessage('❌ Failed to analyze query', 'error');
            }
        }

        // Display routing analysis
        function displayRoutingAnalysis(analysis) {
            const container = document.getElementById('routingAnalysis');
            const content = document.getElementById('routingContent');
            
            content.innerHTML = `
                <div><strong>Recommended Model:</strong> ${analysis.recommended_model}</div>
                <div><strong>Reason:</strong> ${analysis.reason}</div>
                <div><strong>Complexity:</strong> ${analysis.complexity}</div>
                <div><strong>Confidence:</strong> ${(analysis.confidence * 100).toFixed(0)}%</div>
            `;
            
            container.classList.add('show');
        }

        // Compare models
        async function compareModels() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                showMessage('Please enter a prompt first', 'error');
                return;
            }

            // Get selected models
            const selectedModels = Array.from(document.querySelectorAll('.model-checkbox.selected'))
                .map(el => el.dataset.model);

            if (selectedModels.length === 0) {
                showMessage('Please select at least one model', 'error');
                return;
            }

            // Disable button and show loading
            const compareBtn = document.getElementById('compareBtn');
            compareBtn.disabled = true;
            compareBtn.innerHTML = '<span class="loading-spinner"></span> Comparing...';

            try {
                const response = await fetch('/api/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: prompt,
                        models: selectedModels 
                    })
                });

                const results = await response.json();
                displayComparison(results);
                
                if (results.routing_analysis) {
                    displayRoutingAnalysis(results.routing_analysis);
                }
                
            } catch (error) {
                console.error('Comparison failed:', error);
                showMessage('❌ Failed to compare models', 'error');
            } finally {
                compareBtn.disabled = false;
                compareBtn.innerHTML = '🚀 Compare Models';
            }
        }

        // Display comparison results
        function displayComparison(results) {
            const grid = document.getElementById('comparisonGrid');
            grid.innerHTML = '';

            const recommendedModel = results.routing_analysis?.recommended_model;

            Object.entries(results.responses).forEach(([modelName, data]) => {
                const isRecommended = modelName === recommendedModel;
                const card = createModelCard(modelName, data, isRecommended);
                grid.appendChild(card);
            });

            // Show comparison metrics
            if (results.comparison_metrics) {
                showMessage(
                    `⚡ Comparison completed in ${results.comparison_metrics.total_time}. Fastest: ${results.comparison_metrics.fastest_model}`,
                    'success'
                );
            }
        }

        // Create model card
        function createModelCard(modelName, data, isRecommended) {
            const card = document.createElement('div');
            card.className = `model-card ${isRecommended ? 'recommended' : ''}`;

            const modelType = getModelType(modelName);
            const badgeClass = getBadgeClass(modelName);

            card.innerHTML = `
                <div class="model-header">
                    <div>
                        <div class="model-name">${modelName}</div>
                        <div class="model-type">${modelType}</div>
                    </div>
                    <div>
                        <span class="model-badge ${badgeClass}">${getModelSize(modelName)}</span>
                        ${isRecommended ? '<span class="model-badge badge-recommended">Recommended</span>' : ''}
                    </div>
                </div>
                
                <div class="model-response">${data.response || data.error || 'No response'}</div>
                
                ${data.metrics ? `
                <div class="model-metrics">
                    <div class="metric-item">
                        <div class="metric-label">Response Time</div>
                        <div class="metric-value">${data.metrics.response_time}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">Tokens</div>
                        <div class="metric-value">${data.metrics.tokens_generated}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">Model Type</div>
                        <div class="metric-value">${data.metrics.model_type}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">Size</div>
                        <div class="metric-value">${data.metrics.model_size}</div>
                    </div>
                </div>
                ` : ''}
            `;

            return card;
        }

        // Helper functions
        function getModelType(modelName) {
            const types = {
                'A_universal_full': 'Maximum Intelligence',
                'B_universal_lite': 'Universal Speed',
                'C_category_specific': 'Healthcare Specialist'
            };
            return types[modelName] || 'Unknown';
        }

        function getBadgeClass(modelName) {
            const classes = {
                'A_universal_full': 'badge-full',
                'B_universal_lite': 'badge-lite',
                'C_category_specific': 'badge-specialist'
            };
            return classes[modelName] || '';
        }

        function getModelSize(modelName) {
            const sizes = {
                'A_universal_full': '3.5GB',
                'B_universal_lite': '800MB',
                'C_category_specific': '8.3MB'
            };
            return sizes[modelName] || 'Unknown';
        }

        // Load all models
        async function loadAllModels() {
            const models = ['A_universal_full', 'B_universal_lite', 'C_category_specific'];
            
            for (const model of models) {
                try {
                    const response = await fetch('/api/load_model', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model_name: model })
                    });
                    
                    const result = await response.json();
                    if (result.success) {
                        systemStatus.loadedModels.push(model);
                    }
                } catch (error) {
                    console.error(`Failed to load ${model}:`, error);
                }
            }
            
            updateStatus();
            showMessage('✅ Model loading completed', 'success');
        }

        // Clear results
        function clearResults() {
            document.getElementById('comparisonGrid').innerHTML = '';
            document.getElementById('routingAnalysis').classList.remove('show');
            document.getElementById('promptInput').value = '';
        }

        // Show message
        function showMessage(text, type) {
            const existing = document.querySelector('.error-message, .success-message');
            if (existing) existing.remove();

            const message = document.createElement('div');
            message.className = type === 'error' ? 'error-message' : 'success-message';
            message.textContent = text;
            
            document.querySelector('.input-section').appendChild(message);
            
            setTimeout(() => message.remove(), 5000);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
