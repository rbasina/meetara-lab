# AI Services Configuration for MeeTARA Lab
# Copy this file to ai_services_config_local.yaml and add your actual API keys
# Never commit the local file with real API keys to version control

ai_services:
  # OpenAI Configuration
  openai_model: "gpt-4o-mini"  # Cost-effective for training data generation
  openai_max_tokens: 2000
  openai_temperature: 0.7
  
  # Google Gemini Configuration
  gemini_model: "gemini-1.5-flash"
  gemini_max_tokens: 2000
  gemini_temperature: 0.7
  
  # DeepSeek Configuration
  deepseek_model: "deepseek-chat"
  deepseek_max_tokens: 2000
  deepseek_temperature: 0.7

# AI Service Settings
ai_config:
  cache_duration: 3600  # 1 hour cache for AI-generated content
  max_scenarios_per_domain: 100
  enable_ai_enhancement: true
  fallback_to_templates: true  # Use existing templates if AI services fail
  quality_threshold: 0.8  # Minimum quality score for AI-generated content

# Environment Variables
# API keys are loaded from environment variables (.env file or system environment)
# This file contains only service configuration settings
