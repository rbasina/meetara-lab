version: '2.0'
description: Quality-focused configuration with premium models for critical domains
last_updated: '2025-07-09'
# config/trinity_config.yaml
llama_cpp_path: G:\My Drive\meetara-lab\llama.cpp\build\bin  # Windows
#llama_cpp_path: /content/meetara-lab/llama.cpp/build/bin

# Model name mappings (centralized model definitions)
model_names:
  qwen2_7b_instruct: "Qwen/Qwen2.5-7B-Instruct"
  qwen2_14b_instruct: "Qwen/Qwen2.5-14B-Instruct"
  mistral_7b_instruct: "mistralai/Mistral-7B-Instruct-v0.2"
  llama2_7b_chat: "meta-llama/Llama-2-7b-chat-hf"
  llama2_13b_chat: "meta-llama/Llama-2-13b-chat-hf"
  llama3_8b_instruct: "meta-llama/Llama-3-8B-Instruct"
  llama3_70b_instruct: "meta-llama/Llama-3-70B-Instruct"
  codellama_7b_instruct: "codellama/CodeLlama-7b-Instruct-hf"
  codellama_13b_instruct: "codellama/CodeLlama-13b-Instruct-hf"
  smollm2_1_7b: "HuggingFaceTB/SmolLM2-1.7B"

model_tiers:
  premium:
    base_model_suggestion: Qwen/Qwen2.5-7B-Instruct
    sample_count: 8000
    num_epochs: 2
    batch_size: 1
    lora_r: 12
    learning_rate: 1e-4
    quality_target: 99.9%
  expert:
    base_model_suggestion: Qwen/Qwen2.5-14B-Instruct
    sample_count: 6000
    num_epochs: 2
    batch_size: 2
    lora_r: 10
    learning_rate: 0.00015
    quality_target: 99.5%
  quality:
    base_model_suggestion: Qwen/Qwen2.5-7B-Instruct
    sample_count: 5000
    num_epochs: 1
    batch_size: 4
    lora_r: 8
    learning_rate: 2e-4
    quality_target: 99.0%
  balanced:
    base_model_suggestion: Qwen/Qwen2.5-7B-Instruct
    sample_count: 4000
    num_epochs: 1
    batch_size: 6
    lora_r: 6
    learning_rate: 0.00025
    quality_target: 98.5%
  fast:
    base_model_suggestion: Qwen/Qwen2.5-7B-Instruct
    sample_count: 3000
    num_epochs: 1
    batch_size: 8
    lora_r: 4
    learning_rate: 3e-4
    quality_target: 98.0%
  lightning:
    base_model_suggestion: HuggingFaceTB/SmolLM2-1.7B
    sample_count: 2000
    num_epochs: 1
    batch_size: 12
    lora_r: 4
    learning_rate: 0.00035
    quality_target: 97.5%
quality_reasoning:
  healthcare: Premium models for safety-critical medical advice
  business: Expert models for strategic decision-making accuracy
  education: Expert models for teaching and learning excellence
  technology: Expert models for technical precision and accuracy
  specialized: Premium models for maximum domain expertise
  creative: Quality models balancing creativity with coherence
  daily_life: Quality models for better life guidance
  space_technology: Expert models for advanced space research and engineering
gpu_configs:
  T4:
    cost_per_hour: 0.4
    max_parallel_jobs: 2
    recommended_models:
    # Primary Models (Optimized for T4)
    - Qwen/Qwen2.5-7B-Instruct
    - HuggingFaceTB/SmolLM2-1.7B
    - meta-llama/Llama-2-7b-chat-hf
    - mistralai/Mistral-7B-Instruct-v0.2
    - codellama/CodeLlama-7b-Instruct-hf
    # Fallback Models (Lower Memory)
    - microsoft/DialoGPT-medium
    batch_size: 4
    estimated_time_per_domain: 15-20 minutes
    # GPU Optimization Settings
    device_map: "auto"
    low_cpu_mem_usage: true
    max_memory: "auto"
    memory_buffer_gb: 1.0
    speed_factor: 1.0
    max_model_size_gb: 8
    quantization: "4bit"
    torch_dtype: "auto"
  V100:
    cost_per_hour: 2.5
    max_parallel_jobs: 6
    recommended_models:
    # Primary Models (Optimized for V100)
    - Qwen/Qwen2.5-7B-Instruct
    - Qwen/Qwen2.5-14B-Instruct
    - meta-llama/Llama-2-7b-chat-hf
    - meta-llama/Llama-2-13b-chat-hf
    - meta-llama/Llama-3-8B-Instruct
    - mistralai/Mistral-7B-Instruct-v0.2
    - codellama/CodeLlama-7b-Instruct-hf
    - codellama/CodeLlama-13b-Instruct-hf
    # Fallback Models
    - HuggingFaceTB/SmolLM2-1.7B
    - microsoft/DialoGPT-medium
    batch_size: 8
    estimated_time_per_domain: 8-12 minutes
    # GPU Optimization Settings
    device_map: "auto"
    low_cpu_mem_usage: true
    max_memory: "auto"
    memory_buffer_gb: 2.0
    speed_factor: 2.5
    max_model_size_gb: 16
    quantization: "8bit"
    torch_dtype: "auto"
  A100:
    cost_per_hour: 4.0
    max_parallel_jobs: 8
    recommended_models:
    # Primary Models (Optimized for A100)
    - Qwen/Qwen2.5-14B-Instruct
    - Qwen/Qwen2.5-7B-Instruct
    - meta-llama/Llama-3-70B-Instruct
    - meta-llama/Llama-2-13b-chat-hf
    - meta-llama/Llama-3-8B-Instruct
    - codellama/CodeLlama-13b-Instruct-hf
    # Secondary Models
    - meta-llama/Llama-2-7b-chat-hf
    - mistralai/Mistral-7B-Instruct-v0.2
    - codellama/CodeLlama-7b-Instruct-hf
    # Fallback Models
    - HuggingFaceTB/SmolLM2-1.7B
    - microsoft/DialoGPT-medium
    batch_size: 16
    estimated_time_per_domain: 4-6 minutes
    # GPU Optimization Settings
    device_map: "auto"
    low_cpu_mem_usage: true
    max_memory: "auto"
    memory_buffer_gb: 4.0
    speed_factor: 5.0
    max_model_size_gb: 32
    quantization: "16bit"
    torch_dtype: "auto"
