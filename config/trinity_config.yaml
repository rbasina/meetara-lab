version: '2.0'
description: Quality-focused configuration with premium models for critical domains
last_updated: '2025-07-09'

# 🚨 CRITICAL DISCOVERY: CUDA Memory Crisis (July 19, 2025)
# After extensive testing on Google Colab A100 (40GB), we discovered:
# 1. 14B models require 40GB+ for training (impossible on single GPU)
# 2. 13B models require 38GB+ for training (impossible on single GPU) 
# 3. 70B models require 180GB+ for training (impossible without multi-GPU)
# 4. GGUF files from large models would be GB-sized (not 8.3MB target)
# 
# SOLUTION: All domains now use 7B-8B models maximum
# - Qwen/Qwen2.5-14B-Instruct → Qwen/Qwen3-4B-Thinking-2507
# - codellama/CodeLlama-13b-Instruct-hf → codellama/CodeLlama-7b-Instruct-hf  
# - meta-llama/Llama-3-70B-Instruct → meta-llama/Llama-3-8B-Instruct
# 
# 🚀 QWEN3 UPGRADE COMPLETE (Sep 2, 2025)
# Enhanced models with superior instruction-following and reasoning capabilities:
# - Qwen/Qwen3-Instruct-2507: Premium instruction-following for all tiers
# - Qwen/Qwen3-Thinking-2507: Advanced reasoning for complex scenarios
# 
# This ensures 100% success rate on Colab A100 with 30GB total pipeline usage

# config/trinity_config.yaml
#llama_cpp_path: G:\My Drive\meetara-lab\llama.cpp\build\bin  # Windows
llama_cpp_path: /content/meetara-lab/llama.cpp/build/bin

# Model name mappings (centralized model definitions)
model_names:
  # Mobile Models (4B parameters - lightweight for mobile devices)
  qwen3_4b_base: "Qwen/Qwen3-4B-Base"
