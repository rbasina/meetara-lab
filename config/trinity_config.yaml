    gpu: "V100"
    parallel_jobs: 6
    time_all_domains: "2-4 hours"
    total_cost: "$10-20"

# ENHANCED LICENSE VERIFICATION - ALL MODELS VERIFIED AS OPEN SOURCE
verified_licenses:
  "HuggingFaceTB/SmolLM2-1.7B": "Apache-2.0"
  "microsoft/Phi-3.5-mini-instruct": "MIT"              # ✅ VERIFIED - Superior reasoning
  "microsoft/Phi-3-medium-4k-instruct": "MIT"           # ✅ VERIFIED - High accuracy
