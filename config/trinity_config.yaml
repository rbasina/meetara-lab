# MeeTARA Lab - Trinity Configuration
# Quality-Focused Domain Mapping with Premium Models for Critical Domains

version: "2.0"
description: "Quality-focused configuration with premium models for critical domains"
last_updated: "2025-07-09"

# QUALITY-FOCUSED MODEL TIERS
model_tiers:
  premium: # 🏆 PREMIUM - Safety-critical domains (Healthcare, Legal, Financial)
    base_model_suggestion: "microsoft/Phi-3-medium-14B-instruct"
    sample_count: 8000
    num_epochs: 2
    batch_size: 1
    lora_r: 12
    learning_rate: 1e-4
    quality_target: 99.9%
    
  expert: # 🎯 EXPERT - Professional excellence (Business, Education, Technology)
    base_model_suggestion: "Qwen/Qwen2.5-14B-Instruct"
    sample_count: 6000
    num_epochs: 2
    batch_size: 2
    lora_r: 10
    learning_rate: 1.5e-4
    quality_target: 99.5%
    
  quality: # 🔝 QUALITY - Better guidance (Daily Life, Creative)
    base_model_suggestion: "microsoft/Phi-3-medium-4k-instruct"
    sample_count: 5000
    num_epochs: 1
    batch_size: 4
    lora_r: 8
    learning_rate: 2e-4
    quality_target: 99.0%
    
  balanced: # ⚖️ BALANCED - General assistance
    base_model_suggestion: "Qwen/Qwen2.5-7B-Instruct"
    sample_count: 4000
    num_epochs: 1
    batch_size: 6
    lora_r: 6
    learning_rate: 2.5e-4
    quality_target: 98.5%
    
  fast: # ⚡ FAST - Quick responses
    base_model_suggestion: "microsoft/Phi-3.5-mini-instruct"
    sample_count: 3000
    num_epochs: 1
    batch_size: 8
    lora_r: 4
    learning_rate: 3e-4
    quality_target: 98.0%
    
  lightning: # ⚡ LIGHTNING - Ultra fast
    base_model_suggestion: "HuggingFaceTB/SmolLM2-1.7B"
    sample_count: 2000
    num_epochs: 1
    batch_size: 12
    lora_r: 4
    learning_rate: 3.5e-4
    quality_target: 97.5%

# QUALITY & ACCURACY JUSTIFICATION BY DOMAIN
quality_reasoning:
  healthcare: "Premium models for safety-critical medical advice"
  business: "Expert models for strategic decision-making accuracy"
  education: "Expert models for teaching and learning excellence"
  technology: "Expert models for technical precision and accuracy"
  specialized: "Premium models for maximum domain expertise"
  creative: "Quality models balancing creativity with coherence"
  daily_life: "Quality models for better life guidance"
  space_technology: "Expert models for advanced space research and engineering"

# ENHANCED GPU CONFIGURATIONS FOR QUALITY MODELS
gpu_configs:
  T4:
    cost_per_hour: 0.40
    max_parallel_jobs: 2      # REDUCED for larger models
    recommended_models: ["microsoft/Phi-3.5-mini-instruct", "HuggingFaceTB/SmolLM2-1.7B"]
    batch_size: 4             # REDUCED for quality
    estimated_time_per_domain: "15-20 minutes"
    
  V100:
    cost_per_hour: 2.50
    max_parallel_jobs: 6      # OPTIMIZED for quality models
    recommended_models: ["Qwen/Qwen2.5-7B-Instruct", "microsoft/Phi-3-medium-4k-instruct"]
    batch_size: 8             # BALANCED for quality
    estimated_time_per_domain: "8-12 minutes"
    
  A100:
    cost_per_hour: 4.00
    max_parallel_jobs: 8      # OPTIMIZED for premium models
    recommended_models: ["Qwen/Qwen2.5-14B-Instruct", "microsoft/Phi-3-medium-14B-instruct"]
    batch_size: 16            # OPTIMAL for quality
    estimated_time_per_domain: "4-6 minutes"

# ENHANCED COST ESTIMATES FOR QUALITY-FOCUSED TRAINING
cost_estimates:
  premium_tier:
    model: "Phi-3-medium-14B-instruct"
    gpu: "A100"
    parallel_jobs: 8
    time_all_domains: "2-3 hours"  # QUALITY takes more time
    total_cost: "$8-12"
    
  expert_tier:
    model: "Qwen2.5-14B-Instruct"
    gpu: "A100" 
    parallel_jobs: 8
    time_all_domains: "2-3 hours"
    total_cost: "$8-12"
    
