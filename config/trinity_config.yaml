version: '2.0'
description: Quality-focused configuration with premium models for critical domains
last_updated: '2025-07-09'
model_tiers:
  premium:
    base_model_suggestion: microsoft/Phi-3-medium-4k-instruct
    sample_count: 8000
    num_epochs: 2
    batch_size: 1
    lora_r: 12
    learning_rate: 1e-4
    quality_target: 99.9%
  expert:
    base_model_suggestion: Qwen/Qwen2.5-14B-Instruct
    sample_count: 6000
    num_epochs: 2
    batch_size: 2
    lora_r: 10
    learning_rate: 0.00015
    quality_target: 99.5%
  quality:
    base_model_suggestion: microsoft/Phi-3-medium-4k-instruct
    sample_count: 5000
    num_epochs: 1
    batch_size: 4
    lora_r: 8
    learning_rate: 2e-4
    quality_target: 99.0%
  balanced:
    base_model_suggestion: Qwen/Qwen2.5-7B-Instruct
    sample_count: 4000
    num_epochs: 1
    batch_size: 6
    lora_r: 6
    learning_rate: 0.00025
    quality_target: 98.5%
  fast:
    base_model_suggestion: microsoft/Phi-3.5-mini-instruct
    sample_count: 3000
    num_epochs: 1
    batch_size: 8
    lora_r: 4
    learning_rate: 3e-4
    quality_target: 98.0%
  lightning:
    base_model_suggestion: HuggingFaceTB/SmolLM2-1.7B
    sample_count: 2000
    num_epochs: 1
    batch_size: 12
    lora_r: 4
    learning_rate: 0.00035
    quality_target: 97.5%
quality_reasoning:
  healthcare: Premium models for safety-critical medical advice
  business: Expert models for strategic decision-making accuracy
  education: Expert models for teaching and learning excellence
  technology: Expert models for technical precision and accuracy
  specialized: Premium models for maximum domain expertise
  creative: Quality models balancing creativity with coherence
  daily_life: Quality models for better life guidance
  space_technology: Expert models for advanced space research and engineering
gpu_configs:
  T4:
    cost_per_hour: 0.4
    max_parallel_jobs: 2
    recommended_models:
    - microsoft/Phi-3.5-mini-instruct
    - HuggingFaceTB/SmolLM2-1.7B
    batch_size: 4
    estimated_time_per_domain: 15-20 minutes
  V100:
    cost_per_hour: 2.5
    max_parallel_jobs: 6
    recommended_models:
    - Qwen/Qwen2.5-7B-Instruct
    - microsoft/Phi-3-medium-4k-instruct
    batch_size: 8
    estimated_time_per_domain: 8-12 minutes
  A100:
    cost_per_hour: 4.0
    max_parallel_jobs: 8
    recommended_models:
    - Qwen/Qwen2.5-14B-Instruct
    - microsoft/Phi-3-medium-4k-instruct
    batch_size: 16
    estimated_time_per_domain: 4-6 minutes
cost_estimates:
  premium_tier:
    model: Phi-3-medium-4k-instruct
    gpu: A100
    parallel_jobs: 8
    time_all_domains: 2-3 hours
    total_cost: $8-12
  expert_tier:
    model: Qwen2.5-14B-Instruct
    gpu: A100
    parallel_jobs: 8
    time_all_domains: 2-3 hours
    total_cost: $8-12
  quality_tier:
    model: Phi-3-medium-4k-instruct
    gpu: V100
    parallel_jobs: 6
    time_all_domains: 2-4 hours
    total_cost: $10-20
verified_licenses:
  HuggingFaceTB/SmolLM2-1.7B: Apache-2.0
  microsoft/Phi-3.5-mini-instruct: MIT
  microsoft/Phi-3-medium-4k-instruct: MIT
  Qwen/Qwen2.5-7B-Instruct: Apache-2.0
  Qwen/Qwen2.5-14B-Instruct: Apache-2.0
global_tara_params:
  sequence_length: 256
  validation_target: 101.0
  output_format: Q4_K_M
  target_gguf_size_mb: 8.3
  fallback_base_model: microsoft/Phi-3.5-mini-instruct
  generate_synthetic_data: false
  quality_focus: true
  environment: dev
  safety_critical_domains:
  - healthcare
  - legal
  - financial
  - emergency_care
  - legal_financial
  - emergency_crisis
  - specialized
  expert_domains:
  - business
  - education
  - technology
  - space_technology
  - business_professional
  - research_academic
  - aerospace_transportation
  - industrial_manufacturing
  quality_domains:
  - daily_life
  - creative
  - psychology_wellness
  - sports_recreation
  - travel_tourism
  max_parallel_jobs: 8
  memory_optimization: true
  cache_enabled: true
  enable_validation: true
  enable_quantization_validation: true
  enable_size_validation: true
  log_level: INFO
  enable_detailed_logging: true
  enable_performance_monitoring: true
  strict_mode: true
  allow_fallback: false
  max_retries: 3
  llama_cpp_path: /content/meetara-lab/llama.cpp/build/bin
