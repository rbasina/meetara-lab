model_loading_config:
  torch_dtype: "float16"
  device_map: "auto"  # Changed from null to auto for better memory management
  low_cpu_mem_usage: true  # Changed from false to true for memory efficiency
  trust_remote_code: true
  # Memory optimization settings
  max_memory: "auto"
  offload_folder: "offload"
  # Add any model-specific parameters here if needed

# GPU Configuration for Colab Optimization
gpu_config:
  # Colab GPU Detection
  auto_detect_gpu: true
  gpu_memory_buffer_gb: 2.0  # Reserve 2GB for system operations
  
  # GPU-Specific Settings
  colab_optimizations:
    use_mixed_precision: true
    enable_gradient_checkpointing: true
    pin_memory: true
    num_workers: 2  # Reduced for Colab stability
    
  # GPU Memory Management
  memory_management:
    max_memory: "auto"
    device_map: "auto"
    low_cpu_mem_usage: true
    torch_dtype: "float16"
    
  # GPU Performance Settings
  performance:
    # T4 GPU (Colab Free)
    t4:
      batch_size: 4
      max_memory_gb: 12
      speed_factor: "37x"
      cost_per_hour: 0.0
      
    # V100 GPU (Colab Pro)
    v100:
      batch_size: 8
      max_memory_gb: 16
      speed_factor: "75x"
      cost_per_hour: 2.5
      
    # A100 GPU (Colab Pro+)
    a100:
      batch_size: 16
      max_memory_gb: 40
      speed_factor: "151x"
      cost_per_hour: 4.0
      
    # CPU Fallback
    cpu:
      batch_size: 1
      max_memory_gb: 8
      speed_factor: "1x"
      cost_per_hour: 0.0

# QLoRA Configuration
qlora_config:
  enabled: true
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"
  
  # GPU Requirements
  min_gpu_memory_gb: 8
  recommended_gpu_memory_gb: 16
  
  # Model-Specific QLoRA Settings
  model_specific_settings:
    qwen:
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
      lora_r: 8
      lora_alpha: 16
      lora_dropout: 0.1
    llama:
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
      lora_r: 8
      lora_alpha: 16
      lora_dropout: 0.1
    mistral:
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
      lora_r: 8
      lora_alpha: 16
      lora_dropout: 0.1
    codellama:
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
      lora_r: 8
      lora_alpha: 16
      lora_dropout: 0.1
  
  # Performance Optimization
  optimization:
    gradient_checkpointing: true
    fp16: true
    dataloader_pin_memory: true
    dataloader_num_workers: 4
    
  # Memory Management
  memory_management:
    max_memory: "auto"
    device_map: "auto"
    low_cpu_mem_usage: true
    torch_dtype: "float16"
  
# Approved Models for MeeTARA Lab (Risk-Based Selection)
approved_models:
  # PRIMARY MODELS (Lowest Risk)
  primary:
    qwen_7b: "Qwen/Qwen2.5-7B-Instruct"
    qwen_14b: "Qwen/Qwen2.5-14B-Instruct"
  
  # APPROVED MODELS (Low Risk - Apache-2.0 License)
  approved:
    llama2_7b: "meta-llama/Llama-2-7b-chat-hf"
    llama2_13b: "meta-llama/Llama-2-13b-chat-hf"
    llama3_8b: "meta-llama/Llama-3-8B-Instruct"
