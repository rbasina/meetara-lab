  # Desktop Models (8B parameters - powerful for desktop applications)
  qwen3_8b_base: "Qwen/Qwen3-8B-Base"
  qwen3_8b_instruct: "Qwen/Qwen3-8B-Instruct"
  
  # Universal Models (7B parameters - balanced performance)
  qwen3_7b_instruct: "Qwen/Qwen3-Instruct-2507"
  qwen3_7b_thinking: "Qwen/Qwen3-Thinking-2507"
