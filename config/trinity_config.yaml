# GLOBAL CONFIGURATION
global_tara_params:
  sequence_length: 64
  validation_target: 101.0
  output_format: Q4_K_M
  target_gguf_size_mb: 8.3
  fallback_base_model: microsoft/Phi-3.5-mini-instruct
  generate_synthetic_data: false
  quality_focus: true  # NEW: Prioritize quality over speed
  safety_critical_domains: ["healthcare", "legal", "financial", "emergency_care"]
  expert_domains: ["business", "education", "technology", "space_technology"]
