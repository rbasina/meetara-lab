# MeeTARA Service Integration Configuration
# Enhanced approach for backend-to-frontend service delivery

service_bundle:
  version: "2.0.0"
  approach: "unified_bundle"
  description: "Complete service package for MeeTARA frontend integration"

# Backend paths (meetara-lab)
backend_paths:
  models: "models/production"
  services: "services"
  config: "config"
  output: "deployment/bundles"

# Frontend paths (meetara repository)  
frontend_paths:
  models: "models"
  services: "services"
  config: "config/services"
  api: "api/v1"

# Service bundle structure
bundle_structure:
  models:
    mobile: "meetara_mobile_universal.gguf"
    desktop: "meetara_desktop_universal.gguf"
    
  services:
    emotion:
      - "rms_model.pkl"
      - "ser_model.pkl"
    voice:
      - "healthcare_voice.pkl"
      - "business_voice.pkl"
      - "daily_life_voice.pkl"
      - "education_voice.pkl"
      - "creative_voice.pkl"
      - "technology_voice.pkl"
      - "specialized_voice.pkl"
    translation:
      - "hi_model/"
      - "te_model/"
    routing:
      - "domain_router.pkl"
      - "emotion_router.pkl"
      
  config:
    - "service_config.json"
    - "model_mapping.json"
    - "api_endpoints.json"

# API integration for MeeTARA frontend
api_integration:
  base_url: "/api/v1"
  endpoints:
    chat: 
      path: "/chat"
      method: "POST"
      models: ["mobile", "desktop"]
    emotion_detect:
      path: "/emotion/detect"
      method: "POST"
      services: ["emotion"]
    voice_synthesize:
      path: "/voice/synthesize"
      method: "POST"
      services: ["voice"]
    translate:
      path: "/translate"
      method: "POST"
      services: ["translation"]
    route:
      path: "/route"
      method: "POST"
      services: ["routing"]

# Deployment strategies
deployment:
  strategies:
    - name: "auto_bundle"
      description: "Generate bundle and auto-deploy to MeeTARA repo"
      script: "factory/meetara_service_bundle_generator.py"
      args: ["--deploy", "--target-repo", "../meetara"]
      
    - name: "manual_bundle"
      description: "Generate bundle for manual integration"
      script: "factory/meetara_service_bundle_generator.py"
      
    - name: "direct_sync"
      description: "Direct synchronization with frontend repo"
      script: "scripts/sync_to_frontend.py"

# Quality assurance
quality_checks:
  models:
    - "GGUF format validation"
    - "Size optimization check"
    - "Domain coverage verification"
  services:
    - "Model file integrity"
    - "API endpoint testing"
    - "Configuration validation"
  integration:
    - "Frontend compatibility"
    - "Performance benchmarks"
    - "End-to-end testing"

# AI Services Configuration
ai_services:
  # OpenAI Configuration - Cost-optimized for training data generation
  openai_model: "gpt-3.5-turbo"  # Most cost-effective for training data generation
  openai_max_tokens: 1500  # Reduced for cost efficiency
  openai_temperature: 0.8  # Slightly higher for creativity
  
  # Google Gemini Configuration - Fast but quota-limited
  gemini_model: "gemini-1.5-flash"  # Fastest response time
  gemini_max_tokens: 1500  # Reduced for cost efficiency
  gemini_temperature: 0.8  # Balanced creativity and consistency
  
  # DeepSeek Configuration - Most cost-effective option
  deepseek_model: "deepseek-chat"  # Best value for money
  deepseek_max_tokens: 1500  # Reduced for cost efficiency
  deepseek_temperature: 0.8  # Balanced creativity and consistency

# AI Service Settings - Optimized for training data generation
ai_config:
  cache_duration: 7200  # 2 hour cache for AI-generated content
  max_scenarios_per_domain: 100
  enable_ai_enhancement: true
  fallback_to_templates: true  # Use existing templates if AI services fail
  quality_threshold: 0.8  # Minimum quality score for AI-generated content
  max_consecutive_failures: 3  # Stop using service after 3 consecutive failures
  failure_reset_time: 3600  # Reset failure count after 1 hour

# Service Priority (Cost-effectiveness first)
# 1. DeepSeek - Most cost-effective, reliable
# 2. OpenAI - Reliable, moderate cost
# 3. Gemini - Fastest, but quota-limited

# Environment Variables
# API keys are loaded from environment variables (.env file or system environment)
# This file contains only service configuration settings

# Version management
versioning:
  scheme: "semantic"
  format: "MAJOR.MINOR.PATCH"
  current: "2.0.0"
  changelog: "deployment/CHANGELOG.md"
