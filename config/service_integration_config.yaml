# MeeTARA Service Integration Configuration
# Enhanced approach for backend-to-frontend service delivery

service_bundle:
  version: "2.0.0"
  approach: "unified_bundle"
  description: "Complete service package for MeeTARA frontend integration"

# Backend paths (meetara-lab)
backend_paths:
  models: "models/production"
  services: "services"
  config: "config"
  output: "deployment/bundles"

# Frontend paths (meetara repository)  
frontend_paths:
  models: "models"
  services: "services"
  config: "config/services"
  api: "api/v1"

# Service bundle structure
bundle_structure:
  models:
    mobile: "meetara_mobile_universal.gguf"
    desktop: "meetara_desktop_universal.gguf"
    
  services:
    emotion:
      - "rms_model.pkl"
      - "ser_model.pkl"
    voice:
      - "healthcare_voice.pkl"
      - "business_voice.pkl"
      - "daily_life_voice.pkl"
      - "education_voice.pkl"
      - "creative_voice.pkl"
      - "technology_voice.pkl"
      - "specialized_voice.pkl"
    translation:
      - "hi_model/"
      - "te_model/"
    routing:
      - "domain_router.pkl"
      - "emotion_router.pkl"
      
  config:
    - "service_config.json"
    - "model_mapping.json"
    - "api_endpoints.json"

# API integration for MeeTARA frontend
api_integration:
  base_url: "/api/v1"
  endpoints:
    chat: 
      path: "/chat"
      method: "POST"
      models: ["mobile", "desktop"]
    emotion_detect:
      path: "/emotion/detect"
      method: "POST"
      services: ["emotion"]
    voice_synthesize:
      path: "/voice/synthesize"
      method: "POST"
      services: ["voice"]
    translate:
      path: "/translate"
      method: "POST"
      services: ["translation"]
    route:
      path: "/route"
      method: "POST"
      services: ["routing"]

# Deployment strategies
deployment:
  strategies:
    - name: "auto_bundle"
      description: "Generate bundle and auto-deploy to MeeTARA repo"
      script: "factory/meetara_service_bundle_generator.py"
      args: ["--deploy", "--target-repo", "../meetara"]
      
    - name: "manual_bundle"
      description: "Generate bundle for manual integration"
      script: "factory/meetara_service_bundle_generator.py"
      
    - name: "direct_sync"
      description: "Direct synchronization with frontend repo"
      script: "scripts/sync_to_frontend.py"

# Quality assurance
quality_checks:
  models:
    - "GGUF format validation"
    - "Size optimization check"
    - "Domain coverage verification"
  services:
    - "Model file integrity"
    - "API endpoint testing"
    - "Configuration validation"
  integration:
    - "Frontend compatibility"
    - "Performance benchmarks"
    - "End-to-end testing"

# Version management
versioning:
  scheme: "semantic"
  format: "MAJOR.MINOR.PATCH"
  current: "2.0.0"
  changelog: "deployment/CHANGELOG.md"
